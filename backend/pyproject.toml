[project]
name = "operations-under-pressure-backend"
version = "0.1.0"
description = "Backend API for Operations Under Pressure work-management system"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=23.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.3",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.1.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
